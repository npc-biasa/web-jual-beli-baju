name: Deploy ke InfinityFree

on:
  push:
    branches:
      - main  # Ganti jadi master jika branch utama Anda 'master'

jobs:
  web-deploy:
    name: Proses Upload Resmi git-ftp
    runs-on: ubuntu-latest
    steps:
    - name: Ambil Code Terbaru dari GitHub
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dan Jalankan git-ftp
      env:
        FTP_USER: \${{ secrets.FTP_USERNAME }}
        FTP_PASS: \${{ secrets.FTP_PASSWORD }}
        FTP_HOST: \${{ secrets.FTP_SERVER }}
      run: |
        sudo apt-get update
        sudo apt-get install -y git-ftp
        
        # Format alternatif tanpa tanda `--url` yang sensitif, langsung digabung di akhir perintah
        git ftp init -f -u "\$FTP_USER" -p "\(FTP_PASS" "ftp://\)FTP_HOST/bajuku.rf.gd/htdocs/" --insecure
