name: Deploy ke InfinityFree

on:
  push:
    branches:
      - main  # Ubah ke master jika branch utama Anda bernama master

jobs:
  web-deploy:
    name: Proses Deploy via LFTP
    runs-on: ubuntu-latest
    steps:
    - name: Ambil Code Terbaru dari GitHub
      uses: actions/checkout@v4

    - name: Install lftp dan Upload ke Server
      env:
        FTP_SERVER: ftpuploud.net
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        sudo apt-get update && sudo apt-get install -y lftp
        lftp -e "set ftp:ssl-allow no; open $FTP_SERVER; user $FTP_USERNAME $FTP_PASSWORD; mirror -X .git/ -X .github/ -R ./ /htdocs/; quit"
