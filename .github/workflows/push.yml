name: Deploy ke InfinityFree

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Proses Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Ambil Code Terbaru dari GitHub
      uses: actions/checkout@v3

    - name: Sync files to FTP
      uses: Samkirkland/ftp-deploy-action@v3

      with:
        server: ftpuploud.net
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /htdocs/
        retries: 3
        retry-delay: 10