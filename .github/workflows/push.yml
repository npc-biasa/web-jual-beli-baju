name: Deploy ke InfinityFree

on:
  push:
    branches:
      - main  # Ganti jadi master jika branch utama Anda 'master'

jobs:
  web-deploy:
    name: Proses Upload Resmi git-ftp
    runs-on: ubuntu-latest
    steps:
    - name: Ambil Code Terbaru dari GitHub
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dan Jalankan git-ftp
      run: |
        sudo apt-get update
        sudo apt-get install -y git-ftp
        
        # Menggunakan 'init' dengan opsi -f (force) agar sukses di unggahan pertama kali
        git ftp init -f --user "${{ secrets.FTP_USERNAME }}" --passwd "${{ secrets.FTP_PASSWORD }}" --url "ftp://${{ secrets.FTP_SERVER }}/htdocs/" --insecure
